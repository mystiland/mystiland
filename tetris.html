<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tajný Tetris – MystiLand</title>
    
    <!-- Logo v kartě prohlížeče -->
    <link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/11cf6009-7c8a-4266-826f-40b9c32d7068">
    
    <!-- Ikony (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0711;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d5db;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #a855f7;
            color: #ffffff;
            border-color: #a855f7;
        }

        .game-container {
            background: #140d1e;
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            gap: 30px;
            align-items: flex-start;
            max-width: 550px;
            width: 100%;
            justify-content: center;
        }

        canvas {
            background: #0b0711;
            border: 2px solid rgba(168, 85, 247, 0.4);
            border-radius: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .game-sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 140px;
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #a855f7;
        }

        .control-btn {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
            text-align: center;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
        }

        .controls-hint {
            font-size: 0.75rem;
            color: #6b7280;
            text-align: center;
            line-height: 1.4;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .game-container {
                flex-direction: column;
                align-items: center;
                padding: 20px;
            }
            .game-sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
            }
            .stat-box {
                flex: 1;
                min-width: 100px;
            }
            .control-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <a href="tym.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Zpět na Tým
    </a>

    <div class="game-container">
        <!-- Herní plocha Tetrisu -->
        <canvas id="tetris" width="200" height="400"></canvas>

        <div class="game-sidebar">
            <h2 class="game-title"><i class="fa-solid fa-gamepad"></i> Tetris</h2>
            
            <div class="stat-box">
                <div class="stat-label">Skóre</div>
                <div class="stat-value" id="score">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Linek</div>
                <div class="stat-value" id="lines">0</div>
            </div>

            <button class="control-btn" id="start-btn" onclick="startGame()">Start / Restart</button>

            <div class="controls-hint">
                <strong>Ovládání:</strong><br>
                Šipky ← → : Pohyb<br>
                Šipka ↑ : Otočení<br>
                Šipka ↓ : Rychlý pád
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20); // Každý blok bude mít velikost 20x20 pixelů

        let score = 0;
        let linesCount = 0;
        let dropCounter = 0;
        let dropInterval = 1000; // Rychlost padání (1 sekunda)
        let lastTime = 0;
        let gameOver = false;
        let gameStarted = false;

        // Definice tvarů kostek (Tetramina) a jejich barev
        const matrixes = [
            null,
            [[0, 0, 0], [1, 1, 1], [0, 1, 0]], // T
            [[0, 2, 2], [2, 2, 0], [0, 0, 0]], // Z
            [[3, 3, 0], [0, 3, 3], [0, 0, 0]], // S
            [[0, 0, 4, 0], [0, 0, 4, 0], [0, 0, 4, 0], [0, 0, 4, 0]], // I
            [[5, 5], [5, 5]], // O
            [[0, 0, 6], [6, 6, 6], [0, 0, 0]], // L
            [[7, 0, 0], [7, 7, 7], [0, 0, 0]]  // J
        ];

        const colors = [
            null,
            '#a855f7', // Fialová (T)
            '#ef4444', // Červená (Z)
            '#22c55e', // Zelená (S)
            '#06b6d4', // Modrá/Cyan (I)
            '#eab308', // Žlutá (O)
            '#f97316', // Oranžová (L)
            '#3b82f6'  // Modrá (J)
        ];

        const arena = createMatrix(10, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            lines: 0
        };

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            return matrixes[type];
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // Tenký okraj pro hezčí vzhled kostiček
                        context.lineWidth = 0.05;
                        context.strokeStyle = '#0b0711';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#0b0711';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerRotate(dir) {
            const posX = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = posX;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                score += rowCount * 100;
                linesCount++;
                rowCount *= 2;
            }
            document.getElementById('score').innerText = score;
            document.getElementById('lines').innerText = linesCount;
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                if (gameOver) return;
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerReset() {
            const pieces = '1234567';
            player.matrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
            player.pos.y = 0;
            player.pos.x = ((arena[0].length / 2) | 0) - ((player.matrix[0].length / 2) | 0);
            
            if (collide(arena, player)) {
                gameOver = true;
                gameStarted = false;
                alert("Konec hry! Skóre: " + score);
            }
        }

        function update(time = 0) {
            if (!gameStarted) return;
            
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function startGame() {
            arena.forEach(row => row.fill(0));
            score = 0;
            linesCount = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('lines').innerText = linesCount;
            gameOver = false;
            gameStarted = true;
            playerReset();
            lastTime = performance.now();
            update();
        }

        // Klávesové zkratky
        document.addEventListener('keydown', event => {
            if (!gameStarted) return;

            if (event.key === 'ArrowLeft') {
                playerMove(-1);
            } else if (event.key === 'ArrowRight') {
                playerMove(1);
            } else if (event.key === 'ArrowDown') {
                playerDrop();
            } else if (event.key === 'ArrowUp') {
                playerRotate(1);
            }
        });
    </script>
</body>
</html>
