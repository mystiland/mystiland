<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Název webu v záložce -->
    <title>MystiLand – Minecraft Server</title>
    
    <!-- Logo u názvu v kartě vyhledávače/prohlížeče (Favicon) -->
    <link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/11cf6009-7c8a-4266-826f-40b9c32d7068">
    
    <!-- Font Awesome pro ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            overflow: hidden;
            position: relative;
            /* Měnící se fialové pozadí */
            background: linear-gradient(-45deg, #0d0614, #1a0b2e, #2b1055, #12072b);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Světelný fialový efekt na pozadí */
        .glow-overlay {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 45px 35px;
            max-width: 550px;
            width: 90%;
            background: rgba(18, 10, 31, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(168, 85, 247, 0.25);
        }

        /* Hlavní nadpis MystiLand */
        h1 {
            font-size: 3.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff 30%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
        }

        /* Podnadpis Minecraft server již brzy */
        .subtitle {
            font-size: 1.35rem;
            color: #d8b4fe;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Informační text dole */
        .info-text {
            font-size: 1rem;
            color: #c084fc;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Tlačítko na Discord */
        .btn-discord {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            background: linear-gradient(135deg, #5865F2, #4752C4);
            color: white;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
            transition: all 0.3s ease;
        }

        .btn-discord:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.65);
        }
    </style>
</head>
<body>

    <div class="glow-overlay"></div>

    <div class="container">
        <!-- Hlavní název -->
        <h1>MystiLand</h1>
        
        <!-- Podnadpis -->
        <p class="subtitle">Minecraft server již brzy</p>

        <!-- Text s informací o Discordu -->
        <p class="info-text">
            Připoj se na náš Discord server a buď mezi prvními, kdo se dozví o spuštění!
        </p>

        <!-- Odkaz na Discord -->
        <a href="https://discord.com/invite/3GWM5Vy2HV" class="btn-discord" target="_blank">
            <i class="fa-brands fa-discord"></i> Připojit se na Discord
        </a>
    </div>

</body>
</html>
