<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MystiLand – Minecraft Server</title>
    <!-- Font Awesome pro ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            overflow: hidden;
            position: relative;
            /* Měnící se fialové pozadí */
            background: linear-gradient(-45deg, #0d0614, #1a0b2e, #2b1055, #12072b);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Světelný fialový efekt */
        .glow-overlay {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 40px 30px;
            max-width: 550px;
            width: 90%;
            background: rgba(18, 10, 31, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(168, 85, 247, 0.25);
        }

        /* Logo MystiLand */
        .logo {
            width: 140px;
            height: auto;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 30%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
            line-height: 1.3;
        }

        /* IP Adresa Box */
        .ip-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 5, 20, 0.85);
            border: 1px dashed rgba(192, 132, 252, 0.5);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ip-box:hover {
            border-color: #a855f7;
            background: rgba(20, 10, 35, 0.95);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .ip-text {
            font-family: 'Consolas', monospace;
            font-size: 1.1rem;
            color: #e9d5ff;
            font-weight: bold;
        }

        .copy-btn {
            color: #a855f7;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Discord text sekce dole */
        .discord-info {
            font-size: 1rem;
            color: #d8b4fe;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Tlačítka */
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-discord {
            background: linear-gradient(135deg, #5865F2, #4752C4);
            color: white;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        .btn-discord:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6);
        }
    </style>
</head>
<body>

    <div class="glow-overlay"></div>

    <div class="container">
        <!-- Logo -->
        <img src="https://github.com/user-attachments/assets/11cf6009-7c8a-4266-826f-40b9c32d7068" alt="MystiLand Logo" class="logo">
        
        <!-- Hlavní text -->
        <h1>Již brzy Minecraft server MystiLand</h1>

        <!-- Klikací IP adresa -->
        <div class="ip-box" onclick="copyIP()">
            <span class="ip-text">play.mystiland.eu</span>
            <span class="copy-btn" id="copy-text"><i class="fa-regular fa-copy"></i> Zkopírovat</span>
        </div>

        <!-- Text o Discordu dole -->
        <p class="discord-info">
            Připoj se na náš Discord server, ať ti neutečou žádné novinky, soutěže a informace o otevření!
        </p>

        <!-- Tlačítko na Discord -->
        <div class="buttons">
            <a href="https://discord.com/invite/3GWM5Vy2HV" class="btn btn-discord" target="_blank">
                <i class="fa-brands fa-discord"></i> Připojit se na Discord
            </a>
        </div>
    </div>

    <script>
        function copyIP() {
            navigator.clipboard.writeText("play.mystiland.eu");
            const copyText = document.getElementById("copy-text");
            copyText.innerHTML = '<i class="fa-solid fa-check"></i> Zkopírováno!';
            setTimeout(() => {
                copyText.innerHTML = '<i class="fa-regular fa-copy"></i> Zkopírovat';
            }, 2000);
        }
    </script>
</body>
</html>
